<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1370" viewBox="0 0 1200 1370" role="img" aria-labelledby="bench-title bench-desc"><title id="bench-title">Qdrant release comparison</title><desc id="bench-desc">Median round-trip time per six-query batch, in milliseconds. Each version and condition includes 200 measured batches.</desc><rect width="1200" height="1370" fill="#faf7ef"/><text x="76" y="80" fill="#212e2a" font-family="Helvetica" font-size="24" font-weight="bold" text-anchor="start">TECHPULSE   /   BENCHMARK NOTES</text><text x="1124" y="80" fill="#212e2a" font-family="Helvetica" font-size="24" font-weight="normal" text-anchor="end">22 NOV 2026</text><path d="M76 106H1124" stroke="#263b32" stroke-width="2"/><text x="72" y="215" fill="#212e2a" font-family="Georgia" font-size="69" font-weight="normal" text-anchor="start">What changed in Qdrant 1.20.2?</text><text x="76" y="278" fill="#212e2a" font-family="Helvetica" font-size="32" font-weight="normal" text-anchor="start">Median latency per six-query batch   ·   Lower is better</text><text x="76" y="375" fill="#212e2a" font-family="Helvetica" font-size="34" font-weight="bold" text-anchor="start">One shared seller filter</text><text x="76" y="436" fill="#212e2a" font-family="Helvetica" font-size="30" font-weight="normal" text-anchor="start">1.20.1</text><rect x="220" y="406" width="481.04" height="36" fill="#86958e"/><text x="716.0438875" y="435" fill="#212e2a" font-family="Helvetica" font-size="29" font-weight="bold" text-anchor="start">0.583 ms</text><text x="76" y="498" fill="#212e2a" font-family="Helvetica" font-size="30" font-weight="normal" text-anchor="start">1.20.2</text><rect x="220" y="468" width="485.10" height="36" fill="#16604a"/><text x="720.0995875" y="497" fill="#212e2a" font-family="Helvetica" font-size="29" font-weight="bold" text-anchor="start">0.588 ms</text><text x="76" y="602" fill="#212e2a" font-family="Helvetica" font-size="34" font-weight="bold" text-anchor="start">Six different seller filters</text><text x="76" y="663" fill="#212e2a" font-family="Helvetica" font-size="30" font-weight="normal" text-anchor="start">1.20.1</text><rect x="220" y="633" width="622.45" height="36" fill="#86958e"/><text x="857.4455874999999" y="662" fill="#212e2a" font-family="Helvetica" font-size="29" font-weight="bold" text-anchor="start">0.754 ms</text><text x="76" y="725" fill="#212e2a" font-family="Helvetica" font-size="30" font-weight="normal" text-anchor="start">1.20.2</text><rect x="220" y="695" width="636.63" height="36" fill="#16604a"/><text x="871.6252749999999" y="724" fill="#212e2a" font-family="Helvetica" font-size="29" font-weight="bold" text-anchor="start">0.772 ms</text><path d="M76 796H1124" stroke="#81938a"/><text x="76" y="851" fill="#212e2a" font-family="Helvetica" font-size="29" font-weight="normal" text-anchor="start">24,000 synthetic products   /   64 dimensions   /   Apple Silicon</text><text x="76" y="904" fill="#212e2a" font-family="Helvetica" font-size="29" font-weight="normal" text-anchor="start">200 warm batches per version and filter condition.</text><text x="76" y="949" fill="#212e2a" font-family="Helvetica" font-size="26" font-weight="normal" text-anchor="start">Four fresh index builds. Release order: old, new, new, old.</text><text x="76" y="1042" fill="#212e2a" font-family="Georgia" font-size="48" font-weight="normal" text-anchor="start">Nested offers filter</text><text x="76" y="1098" fill="#212e2a" font-family="Helvetica" font-size="29" font-weight="normal" text-anchor="start">30,000 products   /   768 dimensions   /   Independent bar scale</text><text x="76" y="1180" fill="#212e2a" font-family="Helvetica" font-size="30" font-weight="normal" text-anchor="start">1.20.1</text><rect x="220" y="1150" width="590.26" height="36" fill="#86958e"/><text x="825.2582069393247" y="1179" fill="#212e2a" font-family="Helvetica" font-size="29" font-weight="bold" text-anchor="start">41.14 ms</text><text x="76" y="1250" fill="#212e2a" font-family="Helvetica" font-size="30" font-weight="normal" text-anchor="start">1.20.2</text><rect x="220" y="1220" width="656.73" height="36" fill="#16604a"/><text x="891.734376123337" y="1249" fill="#212e2a" font-family="Helvetica" font-size="29" font-weight="bold" text-anchor="start">45.77 ms</text><text x="76" y="1320" fill="#212e2a" font-family="Helvetica" font-size="28" font-weight="normal" text-anchor="start">60 timed batches per version across two fresh index builds.</text></svg>