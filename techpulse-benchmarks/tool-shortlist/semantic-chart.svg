<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><title>Keyword and embedding search on the same 200 tool requests</title><rect x="0" y="0" width="1200" height="820" fill="#faf8f4" /><text x="54" y="62" fill="#4e6174" font-size="23" font-weight="700" font-family="Arial,sans-serif">AGENT TOOL SEARCH   /   LOCAL CPU</text><text x="54" y="142" fill="#272b35" font-size="52" font-weight="700" font-family="Arial,sans-serif">One recovered tool, a different trade-off</text><text x="54" y="204" fill="#272b35" font-size="29" font-weight="400" font-family="Arial,sans-serif">480 tools  ·  200 questions  ·  five candidates per question</text><text x="55" y="307" fill="#272b35" font-size="29" font-weight="700" font-family="Arial,sans-serif">Search</text><text x="402" y="307" fill="#272b35" font-size="29" font-weight="700" font-family="Arial,sans-serif">Target in top 5</text><text x="716" y="307" fill="#272b35" font-size="29" font-weight="700" font-family="Arial,sans-serif">Median</text><text x="975" y="307" fill="#272b35" font-size="29" font-weight="700" font-family="Arial,sans-serif">p95</text><text x="55" y="403" fill="#474459" font-size="35" font-weight="700" font-family="Arial,sans-serif">BM25</text><text x="402" y="403" fill="#474459" font-size="35" font-weight="700" font-family="Arial,sans-serif">189 / 200</text><text x="716" y="403" fill="#474459" font-size="35" font-weight="700" font-family="Arial,sans-serif">0.22 ms</text><text x="975" y="403" fill="#474459" font-size="35" font-weight="700" font-family="Arial,sans-serif">0.33 ms</text><rect x="55" y="427" width="1080" height="2" fill="#d6d6ce" /><text x="55" y="511" fill="#175d63" font-size="35" font-weight="700" font-family="Arial,sans-serif">MiniLM</text><text x="402" y="511" fill="#175d63" font-size="35" font-weight="700" font-family="Arial,sans-serif">187 / 200</text><text x="716" y="511" fill="#175d63" font-size="35" font-weight="700" font-family="Arial,sans-serif">26.56 ms</text><text x="975" y="511" fill="#175d63" font-size="35" font-weight="700" font-family="Arial,sans-serif">27.36 ms</text><rect x="55" y="535" width="1080" height="2" fill="#d6d6ce" /><text x="55" y="620" fill="#272b35" font-size="32" font-weight="700" font-family="Arial,sans-serif">MiniLM recovered 5 keyword misses and lost 7 keyword hits.</text><text x="55" y="689" fill="#272b35" font-size="26" font-weight="400" font-family="Arial,sans-serif">Currency converter: absent from keyword results; embedding rank #2.</text><text x="55" y="764" fill="#272b35" font-size="23" font-weight="400" font-family="Arial,sans-serif">Warm indexes. One query at a time. Embedding latency includes encoding the question.</text></svg>