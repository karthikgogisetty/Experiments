<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><title>Keyword, embedding and hybrid search on the same 200 tool requests</title><rect x="0" y="0" width="1200" height="820" fill="#faf8f4" /><text x="54" y="62" fill="#4e6174" font-size="23" font-weight="700" font-family="Arial,sans-serif">AGENT TOOL SEARCH   /   LOCAL CPU</text><text x="54" y="142" fill="#272b35" font-size="52" font-weight="700" font-family="Arial,sans-serif">Can hybrid search keep the keyword hits?</text><text x="54" y="204" fill="#272b35" font-size="29" font-weight="400" font-family="Arial,sans-serif">480 tools  ·  200 questions  ·  five candidates per question</text><text x="55" y="307" fill="#272b35" font-size="29" font-weight="700" font-family="Arial,sans-serif">Search</text><text x="402" y="307" fill="#272b35" font-size="29" font-weight="700" font-family="Arial,sans-serif">Target in top 5</text><text x="716" y="307" fill="#272b35" font-size="29" font-weight="700" font-family="Arial,sans-serif">Median</text><text x="975" y="307" fill="#272b35" font-size="29" font-weight="700" font-family="Arial,sans-serif">p95</text><text x="55" y="374" fill="#474459" font-size="35" font-weight="700" font-family="Arial,sans-serif">BM25</text><text x="402" y="374" fill="#474459" font-size="35" font-weight="700" font-family="Arial,sans-serif">189 / 200</text><text x="716" y="374" fill="#474459" font-size="35" font-weight="700" font-family="Arial,sans-serif">0.25 ms</text><text x="975" y="374" fill="#474459" font-size="35" font-weight="700" font-family="Arial,sans-serif">0.38 ms</text><rect x="55" y="398" width="1080" height="2" fill="#d6d6ce" /><text x="55" y="450" fill="#175d63" font-size="35" font-weight="700" font-family="Arial,sans-serif">MiniLM</text><text x="402" y="450" fill="#175d63" font-size="35" font-weight="700" font-family="Arial,sans-serif">187 / 200</text><text x="716" y="450" fill="#175d63" font-size="35" font-weight="700" font-family="Arial,sans-serif">29.41 ms</text><text x="975" y="450" fill="#175d63" font-size="35" font-weight="700" font-family="Arial,sans-serif">30.33 ms</text><rect x="55" y="474" width="1080" height="2" fill="#d6d6ce" /><text x="55" y="526" fill="#175d63" font-size="35" font-weight="700" font-family="Arial,sans-serif">Hybrid</text><text x="402" y="526" fill="#175d63" font-size="35" font-weight="700" font-family="Arial,sans-serif">193 / 200</text><text x="716" y="526" fill="#175d63" font-size="35" font-weight="700" font-family="Arial,sans-serif">29.66 ms</text><text x="975" y="526" fill="#175d63" font-size="35" font-weight="700" font-family="Arial,sans-serif">30.59 ms</text><rect x="55" y="550" width="1080" height="2" fill="#d6d6ce" /><text x="55" y="620" fill="#272b35" font-size="32" font-weight="700" font-family="Arial,sans-serif">Hybrid recovered 5 keyword misses and lost 1 keyword hits.</text><text x="55" y="689" fill="#272b35" font-size="26" font-weight="400" font-family="Arial,sans-serif">Currency converter: keyword miss, embedding #2, hybrid #5.</text><text x="55" y="764" fill="#272b35" font-size="23" font-weight="400" font-family="Arial,sans-serif">Warm indexes. One query at a time. Embedding latency includes encoding the question.</text></svg>